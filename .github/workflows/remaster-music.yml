name: Generate remastered game music

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/remaster-music.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate background music only
        run: node scripts/generate-remaster-music.mjs

      - name: Validate music and source
        run: |
          node --check src/remaster-patch.js
          npm run build
          test -s assets/raid-ambient.wav
          test -s assets/raid-combat.wav
          test -s assets/underground.wav

      - name: Commit remastered music
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/raid-ambient.wav assets/raid-combat.wav assets/underground.wav
          git commit -m "Remaster lobby combat and underground music" || exit 0
          git push
