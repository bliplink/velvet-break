name: Bootstrap latest Iron Extraction source

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap-game.yml"

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bootstrap repository
        uses: actions/checkout@v4

      - name: Reconstruct clean game source
        shell: bash
        run: |
          set -euo pipefail
          site="https://sou-da-che-fps-20260913.k-de-shuai.chatgpt.site"
          rm -rf /tmp/game
          mkdir -p /tmp/game

          while read -r sha path; do
            mkdir -p "/tmp/game/$(dirname "$path")"
            curl -fLsS "$site/$path" -o "/tmp/game/$path"
          done < "$GITHUB_WORKSPACE/.bootstrap/static-sha256.txt"

          (
            cd /tmp/game
            sha256sum -c "$GITHUB_WORKSPACE/.bootstrap/static-sha256.txt"
          )

          cp "$GITHUB_WORKSPACE/.bootstrap/index.html" /tmp/game/index.html
          echo "283bb231c8342b72d84d8a7f2c07c82e1568c6d18692ea900baaa5bdf72042a6  /tmp/game/index.html" | sha256sum -c -

          cat > /tmp/game/README.md <<'EOF'
          # Iron Extraction

          一个纯前端的第一视角摸金射击原型，包含：

          - 第一视角移动与射击
          - 可搜索物资箱
          - 战利品背包与仓库
          - 敌人巡逻与交火
          - 多个撤离点与撤离结算
          - 商店、补给、变卖战利品
          - 小地图与全屏地图

          ## 运行

          ```bash
          npm start
          ```

          然后打开 `http://localhost:5531`。

          ## 构建

          ```bash
          npm run build
          ```

          静态站点会生成到 `dist/client`。

          ## 操作

          - `WASD` 移动
          - `鼠标` 视角
          - `F` 开火
          - `R` 换弹
          - `Shift` 冲刺
          - `Q` 使用医疗包
          - `E` 搜索 / 撤离
          - `M` 打开战术地图
          - `C` 使用兵种技能
          - `Esc` 退出指针锁定
          EOF

          cat > /tmp/game/package.json <<'EOF'
          {
            "name": "iron-extraction",
            "version": "1.0.0",
            "private": true,
            "scripts": {
              "start": "node server.js",
              "build": "node build-site.mjs"
            }
          }
          EOF

          cat > /tmp/game/build-site.mjs <<'EOF'
          import { cp, mkdir, rm } from 'node:fs/promises';
          import { resolve } from 'node:path';

          const root = process.cwd();
          const dist = resolve(root, 'dist');
          const client = resolve(dist, 'client');

          await rm(dist, { recursive: true, force: true });
          await mkdir(resolve(dist, 'server'), { recursive: true });
          await cp(resolve(root, 'site-worker.js'), resolve(dist, 'server', 'index.js'));

          for (const name of ['index.html', 'src', 'styles', 'vendor', 'assets']) {
            await cp(resolve(root, name), resolve(client, name), { recursive: true });
          }
          EOF

          cat > /tmp/game/site-worker.js <<'EOF'
          export default {
            async fetch(request, env) {
              const url = new URL(request.url);
              if (url.pathname === '/') url.pathname = '/index.html';
              return env.ASSETS.fetch(new Request(url, request));
            },
          };
          EOF

          cat > /tmp/game/server.js <<'EOF'
          const http = require('node:http');
          const fs = require('node:fs');
          const path = require('node:path');

          const root = __dirname;
          const port = Number(process.env.PORT || 5531);

          const mimeTypes = {
            '.css': 'text/css; charset=utf-8',
            '.html': 'text/html; charset=utf-8',
            '.js': 'text/javascript; charset=utf-8',
            '.json': 'application/json; charset=utf-8',
            '.svg': 'image/svg+xml',
            '.png': 'image/png',
            '.jpg': 'image/jpeg',
            '.jpeg': 'image/jpeg',
            '.ico': 'image/x-icon',
            '.wav': 'audio/wav',
          };

          const server = http.createServer((request, response) => {
            const requestUrl = new URL(request.url, `http://${request.headers.host}`);
            let pathname = decodeURIComponent(requestUrl.pathname);
            if (pathname === '/') pathname = '/index.html';

            const resolvedPath = path.normalize(path.join(root, pathname));
            if (!resolvedPath.startsWith(root)) {
              response.writeHead(403, { 'Content-Type': 'text/plain; charset=utf-8' });
              response.end('Forbidden');
              return;
            }

            fs.readFile(resolvedPath, (error, buffer) => {
              if (error) {
                response.writeHead(error.code === 'ENOENT' ? 404 : 500, { 'Content-Type': 'text/plain; charset=utf-8' });
                response.end(error.code === 'ENOENT' ? 'Not found' : 'Server error');
                return;
              }

              const ext = path.extname(resolvedPath).toLowerCase();
              response.writeHead(200, {
                'Content-Type': mimeTypes[ext] || 'application/octet-stream',
                'Cache-Control': 'no-store',
              });
              response.end(buffer);
            });
          });

          server.listen(port, () => {
            console.log(`Iron Extraction server listening on http://127.0.0.1:${port}`);
          });
          EOF

          cat > /tmp/game/.gitignore <<'EOF'
          node_modules/
          dist/
          screenshots/
          .codex-artifacts/
          .codex-*.png
          server.err.log
          server.out.log
          .openai/
          EOF

      - name: Validate reconstructed source
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/game
          npm run build
          test -f dist/client/index.html
          test -f dist/client/src/main.js
          test -f dist/client/styles/main.css
          test -f dist/client/vendor/babylon.js
          test -f dist/client/assets/raid-combat.wav

      - name: Replace repository with clean game source
        shell: bash
        run: |
          set -euo pipefail
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -C /tmp/game --exclude=dist -cf - . | tar -C "$GITHUB_WORKSPACE" -xf -
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import latest Iron Extraction game source"
          git push origin main
