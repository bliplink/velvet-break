name: Playwright QA

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/playwright-qa.yml"
      - "index.html"
      - "src/**"
      - "scripts/**"
      - "styles/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run syntax checks
        run: |
          node --check src/main.js
          for f in src/*.js; do node --check "$f"; done

      - name: Start local game server
        run: |
          node server.js > /tmp/game.log 2>&1 &
          for i in {1..50}; do
            curl -fsS http://127.0.0.1:5531/ >/dev/null && break
            sleep 0.2
          done

      - name: Run full Playwright game smoke test
        run: npm run test:browser

      - name: Verify optimized elimination replay
        run: node scripts/death-replay-smoke.cjs

      - name: Verify visual overhaul
        run: node scripts/visual-overhaul-smoke.cjs

      - name: Verify performance visibility and repeat rescue
        run: node scripts/performance-rescue-smoke.cjs

      - name: Verify fair vision and canister remodel
        run: node scripts/fair-vision-canister-smoke.cjs

      - name: Upload QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-qa-screenshots
          path: screenshots/
          if-no-files-found: ignore
