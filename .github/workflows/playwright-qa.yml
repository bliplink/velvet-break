name: Playwright QA

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/playwright-qa.yml"
      - "index.html"
      - "src/**"
      - "scripts/**"
      - "styles/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playwright-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run syntax checks
        run: |
          node --check src/main.js
          for f in src/*.js; do node --check "$f"; done

      - name: Reject mojibake and replacement characters
        run: |
          python3 - <<'PY'
          from pathlib import Path
          roots = [Path("index.html"), Path("src"), Path("styles")]
          bad = ["Ã", "Â", "â€™", "â€“", "â€”", "ï¿½", "�"]
          hits = []
          files = [roots[0]]
          for root in roots[1:]:
              files.extend(p for p in root.rglob("*") if p.is_file() and p.suffix in {".js", ".css", ".html"})
          for path in files:
              text = path.read_text(encoding="utf-8")
              for token in bad:
                  if token in text:
                      hits.append(f"{path}: contains {token!r}")
          if hits:
              raise SystemExit("\n".join(hits))
          print(f"Encoding scan passed across {len(files)} text assets")
          PY

      - name: Verify final authority patch is loaded last
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = [line for line in html.splitlines() if "<script" in line and "src/" in line]
          assert scripts, "No game scripts found"
          assert "final-polish-patch.js" in scripts[-1], "final-polish-patch.js must remain the last game patch"
          print(scripts[-1].strip())
          PY

      - name: Start local game server
        run: |
          node server.js > /tmp/game.log 2>&1 &
          for i in {1..50}; do
            curl -fsS http://127.0.0.1:5531/ >/dev/null && break
            sleep 0.2
          done

      - name: Run comprehensive self-test audit
        continue-on-error: true
        run: node scripts/full-selftest.cjs

      - name: Run full Playwright game smoke test
        run: npm run test:browser

      - name: Verify optimized elimination replay
        run: node scripts/death-replay-smoke.cjs

      - name: Verify visual overhaul
        run: node scripts/visual-overhaul-smoke.cjs

      - name: Verify window entry and opaque lockdown buildings
        run: node scripts/window-opacity-smoke.cjs

      - name: Verify performance visibility and repeat rescue
        run: node scripts/performance-rescue-smoke.cjs

      - name: Verify frame-rate performance governor and Blitz load
        run: node scripts/performance-blitz-smoke.cjs

      - name: Verify fair vision and canister remodel
        run: node scripts/fair-vision-canister-smoke.cjs

      - name: Verify tactical AI utilities and final opaque buildings
        run: node scripts/ai-utility-building-smoke.cjs

      - name: Verify visible AI utility throw animation
        run: node scripts/ai-throw-animation-smoke.cjs

      - name: Verify enemies cannot xray through buildings
        run: node scripts/enemy-occlusion-smoke.cjs

      - name: Verify latest combat and utility regressions
        run: node scripts/latest-combat-regression.cjs


      - name: Verify real Lockdown wall occlusion
        run: node scripts/lockdown-wall-occlusion-smoke.cjs




      - name: Verify unified 10-second stun control
        run: node scripts/stun-control-smoke.cjs



      - name: Verify rescue Benjamin balance xray and original model
        run: node scripts/polish-v2-smoke.cjs

      - name: Verify operator balance regression
        run: node scripts/operator-regression.cjs

      - name: Verify live operator power effects
        run: node scripts/operator-power-smoke.cjs

      - name: Verify combat polish
        run: node scripts/combat-polish-smoke.cjs

      - name: Verify Echo purchase persistence across modes
        run: node scripts/echo-persistence-smoke.cjs

      - name: Verify Echo Phase and Kai balance
        run: node scripts/echo-kai-balance-smoke.cjs

      - name: Verify ultimate and action feedback HUD
        run: node scripts/combat-feedback-smoke.cjs


      - name: Verify persistence shop and protected reset
        run: node scripts/persistence-reset-smoke.cjs

      - name: Verify risk reward raid loop v2
        run: node scripts/raid-loop-v2-smoke.cjs

      - name: Verify tactical extraction and enemy roles
        run: node scripts/tactical-loop-smoke.cjs

      - name: Verify Lockdown ghost cache easter egg
        run: node scripts/lockdown-easter-egg-smoke.cjs

      - name: Verify Vehicle Battlefield
        run: node scripts/battlefield-smoke.cjs

      - name: Verify Vehicle Battlefield combat
        run: node scripts/battlefield-combat-smoke.cjs


      - name: Verify Nameless guards reset every raid
        run: node scripts/nameless-reset-smoke.cjs

      - name: Pack local Playwright runtime
        if: always()
        run: |
          tar -czf local-playwright-runtime.tgz \
            node_modules/playwright \
            node_modules/playwright-core \
            package.json package-lock.json server.js scripts \
            -C "$HOME/.cache" ms-playwright

      - name: Upload local Playwright runtime
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-playwright-runtime
          path: local-playwright-runtime.tgz
          retention-days: 1

      - name: Upload QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-qa-screenshots
          path: screenshots/
          if-no-files-found: ignore
