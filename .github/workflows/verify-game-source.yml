name: Verify Iron Extraction deployed source

on:
  push:
    branches: [main]
    paths:
      - ".bootstrap/static-sha256.txt"
      - ".github/workflows/verify-game-source.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout manifest
        uses: actions/checkout@v4

      - name: Compare deployed game files with uploaded local source
        shell: bash
        run: |
          set -euo pipefail
          base="https://sou-da-che-fps-20260913.k-de-shuai.chatgpt.site"
          rm -rf /tmp/site
          mkdir -p /tmp/site
          while read -r sha path; do
            mkdir -p "/tmp/site/$(dirname "$path")"
            curl -fLsS "$base/$path" -o "/tmp/site/$path"
          done < .bootstrap/static-sha256.txt
          cd /tmp/site
          sha256sum -c "$GITHUB_WORKSPACE/.bootstrap/static-sha256.txt"
