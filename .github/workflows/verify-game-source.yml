name: Verify uploaded local source against deployed game

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-game-source.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify every deployed game file by SHA-256
        shell: bash
        run: |
          set -euo pipefail
          base="https://sou-da-che-fps-20260913.k-de-shuai.chatgpt.site"
          cat > /tmp/expected.txt <<'EOF'
