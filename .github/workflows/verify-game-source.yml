          rm -rf /tmp/site && mkdir -p /tmp/site
          while read -r sha path; do
            mkdir -p "/tmp/site/$(dirname "$path")"
            curl --fail --silent --show-error --location "$base/$path" -o "/tmp/site/$path"
          done < /tmp/expected.txt
          cd /tmp/site
          sha256sum -c /tmp/expected.txt
