name: Extract shared Codex chat

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/extract-share.yml"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install share extractor and browser
        run: |
          python -m pip install "searchts[mcp]" patchright
          patchright install --with-deps chromium

      - name: Extract shared ChatGPT/Codex snapshot
        env:
          SEARCHTS_NO_JINA: "1"
        run: |
          searchts read "https://chatgpt.com/s/cx_6aadded667ac8191851599c9fc8e5a05" > shared-chat.md
          test -s shared-chat.md

      - name: Commit extracted snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shared-chat.md
          git commit -m "Extract 搜打撤 shared chat source" || exit 0
          git push
