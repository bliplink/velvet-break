name: Runtime smoke test

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/runtime-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install browser test dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Static syntax check
        run: |
          node --check src/main.js
          for f in src/*.js; do node --check "$f"; done

      - name: Start local game
        run: |
          node server.js > /tmp/game.log 2>&1 &
          echo $! > /tmp/game.pid
          for i in {1..50}; do
            curl -fsS http://127.0.0.1:5531/ >/dev/null && break
            sleep 0.2
          done

      - name: Smoke launch and deploy
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage({viewport:{width:1280,height:800}});
            const errors=[];
            const consoleErrors=[];
            const failed=[];
            page.on('pageerror', e => errors.push(e.stack || e.message));
            page.on('console', m => { if (m.type()==='error') consoleErrors.push(m.text()); });
            page.on('requestfailed', r => failed.push({url:r.url(), error:r.failure()?.errorText}));
            await page.goto('http://127.0.0.1:5531/?runtime-smoke=1', {waitUntil:'networkidle', timeout:60000});
            await page.waitForTimeout(1200);
            const base = await page.evaluate(() => ({
              title: document.title,
              body: document.body.innerText.slice(0,800),
              remaster: window.__sdrRemasterDebug ?? null,
              mode: typeof state !== 'undefined' ? state.mode : 'NO_STATE',
              engine: Boolean(window.__sdrEngine),
              scene: Boolean(window.__sdrScene),
              deploy: Boolean(document.querySelector('#deployButton')),
            })).catch(e => ({evalError:String(e)}));
            let after = null;
            try {
              await page.locator('#deployButton').click({timeout:10000});
              await page.waitForTimeout(2500);
              after = await page.evaluate(() => ({
                mode: typeof state !== 'undefined' ? state.mode : 'NO_STATE',
                raid: Boolean(typeof state !== 'undefined' && state.raid),
                enemies: typeof state !== 'undefined' ? (state.raid?.enemies?.length ?? -1) : -1,
                cameraFov: window.__sdrScene?.activeCamera?.fov ?? null,
                remaster: window.__sdrRemasterDebug ?? null,
              })).catch(e => ({evalError:String(e)}));
            } catch (e) {
              after = {clickError:String(e)};
            }
            console.log(JSON.stringify({base,after,errors,consoleErrors,failed},null,2));
            await browser.close();
            if (errors.length || consoleErrors.length || base.mode === 'NO_STATE' || after?.mode !== 'raid') process.exit(1);
          })().catch(e => { console.error(e); process.exit(1); });
          NODE

      - name: Show server log on failure
        if: failure()
        run: cat /tmp/game.log || true
